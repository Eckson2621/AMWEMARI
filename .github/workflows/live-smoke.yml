name: AMWEMARI live smoke tests

on:
  push:
    branches: [qa/live-smoke]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live application checks
        env:
          AMWEMARI_TEST_EMAIL: ${{ secrets.AMWEMARI_TEST_EMAIL }}
          AMWEMARI_TEST_PASSWORD: ${{ secrets.AMWEMARI_TEST_PASSWORD }}
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amwemari-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
