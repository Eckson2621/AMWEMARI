name: Android companion build

on:
  push:
    branches: [security-foundation]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-companion --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amwemari-security-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
