<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EAM Feedback Center | Super Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17212b;font:15px system-ui,Arial}header{background:#102a43;color:#fff;padding:20px 5vw}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #0f172a0a}h1{margin:0;font-size:22px}h2{margin:0 0 12px;font-size:19px}.muted{color:#64748b}label{display:block;font-weight:600;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:8px;padding:10px 14px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.feedback{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:12px 0}.meta{font-size:12px;color:#64748b}.message{white-space:pre-wrap;line-height:1.5;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.danger{background:#475569}.hidden{display:none!important}#loginNotice{margin-top:10px;color:#b45309;font-weight:600}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/feedback-admin.js" defer></script></head>
